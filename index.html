<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Oops-a-Daisy" />
  <meta name="theme-color" content="#2a1f45" />
  <title>Planet Oops-a-Daisy</title>
</head>
<body>
  <div id="game"></div>

  <div id="vignette"></div>
  <div id="hud">
    <div class="hud-left">
      <span id="hud-level"></span>
      <span id="hud-hearts"></span>
    </div>
    <div class="hud-right">
      <span id="hud-items"></span>
      <span id="hud-time">0:00</span>
      <button id="btn-music" title="Music">🎵</button>
      <button id="btn-pause" title="Pause (P)">⏸</button>
    </div>
  </div>
  <div id="hint"></div>
  <div id="banner"></div>
  <button id="btn-skip">Skip ⏭</button>

  <div id="touch">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button id="btn-honk" class="gadget"><span>🎺</span><small>HONK</small></button>
      <button id="btn-moon" class="gadget"><span>👟</span><small>MOON</small></button>
      <button id="btn-donut" class="gadget"><span>🍩</span><small>DONUT</small></button>
      <button id="btn-run" class="gadget run"><span>💨</span><small>RUN</small></button>
    </div>
  </div>

  <div id="overlay" class="hidden"><div id="panel"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
